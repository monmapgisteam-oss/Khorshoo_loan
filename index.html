<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хоршооны зээлийн мэдээлэл</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <h1>ХОРШООНЫ ЗЭЭЛИЙН МЭДЭЭЛЭЛ</h1>
  <div class="selectors">
    <div class="sel" data-field="Аймаг">
      <button class="sel-btn"><svg class="sel-ico" viewBox="0 0 16 16"><path d="M15.364 14.636L9.735 9.008a5.5 5.5 0 1 0-.706.708l5.628 5.627.707-.707zM1 5.5C1 3.019 3.019 1 5.5 1S10 3.019 10 5.5 7.981 10 5.5 10 1 7.981 1 5.5z"/></svg>
        <span class="sel-txt"><span class="sel-label">АЙМАГ</span><span class="sel-state">No category selected</span></span></button>
      <div class="sel-menu"></div>
    </div>
    <div class="sel" data-field="Зөв_сумын_нэр">
      <button class="sel-btn"><svg class="sel-ico" viewBox="0 0 16 16"><path d="M15.364 14.636L9.735 9.008a5.5 5.5 0 1 0-.706.708l5.628 5.627.707-.707zM1 5.5C1 3.019 3.019 1 5.5 1S10 3.019 10 5.5 7.981 10 5.5 10 1 7.981 1 5.5z"/></svg>
        <span class="sel-txt"><span class="sel-label">СУМ</span><span class="sel-state">No category selected</span></span></button>
      <div class="sel-menu"></div>
    </div>
    <div class="sel" data-field="Зээлийн_зориулалт">
      <button class="sel-btn"><svg class="sel-ico" viewBox="0 0 16 16"><path d="M15.364 14.636L9.735 9.008a5.5 5.5 0 1 0-.706.708l5.628 5.627.707-.707zM1 5.5C1 3.019 3.019 1 5.5 1S10 3.019 10 5.5 7.981 10 5.5 10 1 7.981 1 5.5z"/></svg>
        <span class="sel-txt"><span class="sel-label">ЗОРИУЛАЛТ</span><span class="sel-state">No category selected</span></span></button>
      <div class="sel-menu"></div>
    </div>
    <div class="sel" data-field="Банкны_нэр">
      <button class="sel-btn"><svg class="sel-ico" viewBox="0 0 16 16"><path d="M15.364 14.636L9.735 9.008a5.5 5.5 0 1 0-.706.708l5.628 5.627.707-.707zM1 5.5C1 3.019 3.019 1 5.5 1S10 3.019 10 5.5 7.981 10 5.5 10 1 7.981 1 5.5z"/></svg>
        <span class="sel-txt"><span class="sel-label">БАНК</span><span class="sel-state">No category selected</span></span></button>
      <div class="sel-menu"></div>
    </div>
    <div class="sel date-sel">
      <button class="sel-btn"><svg class="sel-ico" viewBox="0 0 16 16"><path d="M1 16h13V6H1v10zm10-9h2v2h-2V7zm0 3h2v2h-2v-2zm0 3h2v2h-2v-2zM8 7h2v2H8V7zm0 3h2v2H8v-2zm0 3h2v2H8v-2zM5 7h2v2H5V7zm0 3h2v2H5v-2zm0 3h2v2H5v-2zM2 7h2v2H2V7zm0 3h2v2H2v-2zm0 3h2v2H2v-2zm9-12V0h-1v1H5V0H4v1H1v4h13V1h-3zm2 3H2V2h2v1h1V2h5v1h1V2h2v2z"/></svg>
        <span class="sel-txt"><span class="sel-label">ОЛГОСОН ОГНОО</span><span class="sel-state">No date selected</span></span></button>
      <div class="sel-menu date-menu">
        <label>Эхлэх<input type="date" id="dateFrom"></label>
        <label>Дуусах<input type="date" id="dateTo"></label>
        <div class="date-actions"><button id="dateApply" class="mini-btn">Хэрэглэх</button><button id="dateClear" class="mini-btn ghost">Цэвэрлэх</button></div>
      </div>
    </div>
    <button id="report-btn" title="Тайлан татах (Word)">
      <svg viewBox="0 0 24 24" stroke-width="2">
        <path d="M12 3v12"></path>
        <path d="M7 10l5 5 5-5"></path>
        <path d="M5 21h14"></path>
      </svg>
      <span>Тайлан</span>
    </button>
    <button id="resetBtn" class="icon-btn" title="Шүүлтүүр цэвэрлэх">&#10227;</button>
  </div>
</header>

<main class="grid">

  <!-- ЗҮҮН БАГАНА -->
  <section class="col col-left panel">
    <div class="panel-title" data-title-for="left"></div>
    <div class="tab-body">
      <div class="tab-pane active" data-pane="l1"><canvas id="chartAimagAmount"></canvas></div>
      <div class="tab-pane" data-pane="l2"><canvas id="chartAimagCount"></canvas></div>
      <div class="tab-pane" data-pane="l3"><canvas id="chartLivestock"></canvas></div>
    </div>
    <div class="tabs" data-tabs="left">
      <button class="tab-nav prev">&#8249;</button>
      <div class="tab-strip">
        <button class="tab active" data-tab="l1">ОЛГОСОН ДҮН</button>
        <button class="tab" data-tab="l2">ОЛГОСОН ТОО</button>
        <button class="tab" data-tab="l3">МАЛЫН ТОО</button>
      </div>
      <button class="tab-nav next">&#8250;</button>
    </div>
  </section>

  <!-- ТӨВ БАГАНА -->
  <section class="col col-center">

    <div class="kpi-row" id="kpiRow"></div>

    <div class="mid-row">
      <div class="panel richtext" id="richText"></div>

      <div class="panel map-panel">
        <div class="panel-title" id="mapTitle">Хоршооны мэдээлэл</div>
        <div class="tab-body">
          <div id="mapView" class="map-host"></div>
          <div class="map-legend">Шүүлтүүрт тохирох хоршоо <b id="mapCount">—</b></div>
        </div>
        <div class="tabs" data-tabs="map">
          <div class="tab-strip">
            <button class="tab active" data-tab="m2d">2D</button>
            <button class="tab" data-tab="m3d">3D</button>
          </div>
        </div>
      </div>

      <div class="mid-right">
        <div class="panel chart-panel"><div class="panel-title">ЗЭЭЛ ОЛГОСОН БАНК</div><div class="chart-wrap"><canvas id="chartBank"></canvas></div></div>
        <div class="panel chart-panel"><div class="panel-title">ЗЭЭЛ ОЛГОСОН ОГНОО</div><div class="chart-wrap"><canvas id="chartIssuedYear"></canvas></div></div>
      </div>
    </div>

    <div class="kpi-row kpi-row-2" id="kpiRow2"></div>

    <div class="bottom-row">
      <div class="panel">
        <div class="panel-title" data-title-for="bottom"></div>
        <div class="tab-body">
          <div class="tab-pane active" data-pane="b1"><canvas id="chartDueYear"></canvas></div>
          <div class="tab-pane" data-pane="b2"><canvas id="chartRepay2024"></canvas></div>
          <div class="tab-pane" data-pane="b3"><canvas id="chartRepay2025"></canvas></div>
        </div>
        <div class="tabs" data-tabs="bottom">
          <button class="tab-nav prev">&#8249;</button>
          <div class="tab-strip">
            <button class="tab active" data-tab="b1">ТӨЛӨЛТИЙН ОГНОО</button>
            <button class="tab" data-tab="b2">2024 ОНД ОЛГОСОН ЗЭЭЛИЙН ТӨЛӨЛТ</button>
            <button class="tab" data-tab="b3">2025 ОНД ОЛГОСОН ЗЭЭЛИЙН ТӨЛӨЛТ</button>
          </div>
          <button class="tab-nav next">&#8250;</button>
        </div>
      </div>
      <div class="panel chart-panel">
        <div class="panel-title">ЯВЦ</div>
        <div class="chart-wrap"><canvas id="chartStatus"></canvas></div>
      </div>
    </div>
  </section>

  <!-- БАРУУН БАГАНА -->
  <section class="col col-right panel">
    <div class="panel-title">ЗЭЭЛИЙН ЗОРИУЛАЛТ ОЛГОСОН ДҮНГЭЭР</div>
    <div class="chart-wrap"><canvas id="chartPurpose"></canvas></div>
  </section>

</main>

<div id="loading" class="loading"><div class="spinner"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/map.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
<script src="https://js.arcgis.com/4.31/"></script>
<script>require(["esri/config"], function(){ if (window.initMap) window.initMap(); });</script>
</body>
</html>
